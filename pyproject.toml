[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsar-hit-screen"
version = "0.1.0"
description = "Ligand-based hit classification and library screening for SLC-family transport inhibitors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "rdkit>=2023.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
extra = ["xgboost>=2.0"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
qsar-score = "qsar_screen.cli:cmd_score"
qsar-screen = "qsar_screen.cli:cmd_screen"
qsar-reward = "qsar_screen.cli:cmd_reward"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
