[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsar-hit-screen"
version = "0.1.0"
description = "Hit classification for SLC-family transport inhibitors: scaffold-split benchmarking of ligand, structural, and learned features"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "rdkit>=2023.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# gradient boosting for the third classifier in the benchmark
boost = ["xgboost>=2.0"]
# frozen CheMeleon embeddings (needs the Zenodo checkpoint, see README)
embeddings = ["chemprop>=2.2", "torch>=2.0"]
# interaction fingerprints from docked poses
structural = ["prolif>=2.0", "MDAnalysis>=2.7"]
dev = ["pytest>=7.4"]
all = ["xgboost>=2.0", "chemprop>=2.2", "torch>=2.0", "prolif>=2.0",
       "MDAnalysis>=2.7", "pytest>=7.4"]

[project.scripts]
qsar-score = "qsar_screen.cli:cmd_score"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
